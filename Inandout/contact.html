<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title.contact">Contact | In&Out</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="contact">
  <div id="site-header"></div>

  <main id="main" class="section">
    <div class="container" style="max-width:640px">
      <h1 data-i18n="contact.title">Contact us</h1>
      <p class="muted" data-i18n="contact.intro">Questions or ideas? Write to us.</p>
      <div class="notice" data-i18n="contact.info">Contact details will be added before launch.</div>

      <div id="load-error" class="notice notice-error hidden" data-i18n="error.load">We could not load this page properly. Please refresh the page or go back to the home page.</div>

      <form id="contact-form" class="card" novalidate>
        <div id="form-error" class="notice notice-error hidden" role="alert" data-i18n="post.fix">Please fix the fields marked in red.</div>
        <div id="form-success" class="notice notice-success hidden" role="status" data-i18n="contact.demo" style="scroll-margin-top:140px">Demo only: your message was not sent.</div>

        <div class="form-row">
          <label for="f-name" data-i18n="contact.name">Your name</label>
          <input id="f-name" type="text" autocomplete="name">
          <p id="err-name" class="field-error hidden"></p>
        </div>

        <div class="form-row">
          <label for="f-email" data-i18n="contact.email">Your email</label>
          <input id="f-email" type="email" autocomplete="email">
          <p id="err-email" class="field-error hidden"></p>
        </div>

        <div class="form-row">
          <label for="f-message" data-i18n="contact.message">Message</label>
          <textarea id="f-message" maxlength="1000"></textarea>
          <p id="err-message" class="field-error hidden"></p>
        </div>

        <button type="submit" class="btn btn-primary btn-block" data-i18n="contact.send">Send message</button>
      </form>
    </div>
  </main>

  <div id="site-footer"></div>

  <noscript>
    <p class="notice notice-error" style="margin:16px">
      This site needs JavaScript. Please switch it on in your browser.<br>
      Для работы сайта нужен JavaScript. Пожалуйста, включите его в браузере.<br>
      Sayt ishlashi uchun JavaScript kerak. Iltimos, uni brauzerda yoqing.
    </p>
  </noscript>

  <script src="features.js"></script>
  <script src="js/safe.js"></script>
  <script src="js/translations.js"></script>
  <script src="js/data.js"></script>
  <script src="js/features/payments.js"></script>
  <script src="js/features/escrow.js"></script>
  <script src="js/features/idcheck.js"></script>
  <script src="js/features/calls.js"></script>
  <script src="js/features/sms.js"></script>
  <script src="js/features/email.js"></script>
  <script src="js/app.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/forms.js"></script>

  <script>
    (function () {
      var IO = window.InAndOut;
      var F = IO.forms;

      function $(id) { return document.getElementById(id); }

      function onSubmit(event) {
        event.preventDefault();
        var c = F.checker();
        var email = $('f-email').value.trim();

        c.check('name', $('f-name').value.trim() !== '', 'form.required');
        c.check('email', F.isEmail(email), email === '' ? 'form.required' : 'form.email');
        c.check('message', $('f-message').value.trim() !== '', 'form.required');

        if (c.firstBad()) {
          F.toggle('form-error', true);
          F.toggle('form-success', false);
          F.focusField(c.firstBad());
          return;
        }

        /* Nothing is sent. Sending real email needs an outside service,
           so this uses the "email notifications" switch in features.js. */
        F.toggle('form-error', false);
        F.toggle('form-success', true);
        try { $('form-success').scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) { /* ignore */ }
        IO.useFeature('emailNotifications', { form: 'contact' });
      }

      if (!F) {
        $('load-error').classList.remove('hidden');
      } else {
        $('contact-form').addEventListener('submit', IO.safe(onSubmit));
      }
    })();
  </script>
</body>
</html>
